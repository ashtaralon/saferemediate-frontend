# Deterministic browser geometry specs (tests/integration/*-fixture.spec.ts).
#
# These intercept the topology proxy routes and serve a captured payload
# (tests/integration/topology-fixture.ts), so they need a running app but no
# backend, and they reproduce identically on any runner. They are NOT a
# deployed-backend smoke — that stays with the *-live specs.
#
# CI is the browser here on purpose: the driving sandbox cannot reach the npm
# registry (see unit-tests.yml), so the only reproducible place to prove that
# the fullscreen rail is reachable and flow edges stay anchored while it
# scrolls is this job.
name: fixture-e2e
on:
  pull_request:
  workflow_dispatch: {}
# contents: write is for the fixture-e2e-results branch below, nothing else.
permissions:
  contents: write
jobs:
  playwright-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Shared only by this job's localhost app and fixture login client.
      # No production credential is used by deterministic browser fixtures.
      SITE_PASSWORD: fixture-only-local-signin-never-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Start the app
        # No backend here on purpose: every route the specs need is answered
        # in the browser by tests/integration/topology-fixture.ts. Point the
        # proxy at a closed local port so any call the fixture does not cover
        # fails fast with a connection error instead of reaching the deployed
        # backend (the default when BACKEND_URL_OVERRIDE is unset).
        env:
          BACKEND_URL_OVERRIDE: http://127.0.0.1:9
        run: |
          set -euo pipefail
          (npx next start -p 3000 > next-start.log 2>&1 &)
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/login; then echo "app up after ${i} tries"; exit 0; fi
            sleep 2
          done
          echo "::error::app did not start"; cat next-start.log; exit 1
      - name: Playwright fixture specs
        # TWO filters must both admit a spec, and both bit me in sequence:
        # this list, AND playwright.config.ts testMatch
        # ["*-live.spec.ts", "*-fixture.spec.ts"]. A file named
        # topology-estate-lower-geometry.spec.ts was on this line and STILL
        # collected nothing (run 34843480384: "Running 6 tests" again), because
        # the name matched neither glob. The suffix is the contract: a
        # deterministic spec must end -fixture.spec.ts.
        #
        # Explicit list, not a glob: the live specs in this directory need a
        # backend and must never run here. A file added to the directory is
        # therefore NOT picked up automatically — topology-estate-lower-geometry
        # was written, pushed, and reported green by a run that never collected
        # it (run 34843099199: "Running 6 tests", the same six as before). Any
        # new fixture spec has to be named here or it is dead weight.
        run: npx playwright test tests/integration/topology-fullscreen-rail-fixture.spec.ts tests/integration/topology-platform-map-qa-fixture.spec.ts tests/integration/topology-estate-lower-geometry-fixture.spec.ts tests/integration/topology-estate-semantics-fixture.spec.ts tests/integration/topology-estate-fullscreen-stacking-fixture.spec.ts tests/integration/topology-estate-egress-map-fixture.spec.ts tests/integration/topology-estate-identity-fixture.spec.ts
        env:
          FRONTEND_URL: http://localhost:3000
          PW_CHANNEL: chromium
          CI: "1"
      - name: Publish screenshots to the results branch
        # Same reason as c1-ui-qa.yml's step of this name: the artifact below
        # lives on an Azure blob host that is not reachable from every
        # reviewer's tooling, and a geometry spec whose whole point is what the
        # page LOOKS like is worthless if nobody can open the screenshot. A
        # results branch is a plain git ref -- `git fetch origin
        # fixture-e2e-results` reads it anywhere the repository is reachable.
        # One directory per run, never merged anywhere.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS_BRANCH: fixture-e2e-results
          RUN_DIR: runs/${{ github.run_id }}
        # Stage screenshots outside the results checkout. A rerun already has
        # this run's files on the branch, and copying them in first aborts
        # checkout (run 35943944649). The script checks out a clean tree, then
        # copies the screenshots in. vercel.json is written after that checkout.
        run: bash scripts/publish-fixture-e2e-results.sh
      - name: Upload report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-fixture-report
          path: |
            playwright-report/
            test-results/
            next-start.log
          retention-days: 7
          if-no-files-found: ignore
