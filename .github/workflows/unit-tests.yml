# Unit + contract-gate tests as a real PR rail. Until now only Vercel's
# build gated FE PRs — vitest (incl. the display-name contract gate that
# blocks per-surface naming heuristics) ran only on dev machines.
name: unit-tests
on:
  pull_request:
  push:
    branches: [main]
  # On-demand run against any branch. Without this the suite was reachable only
  # by opening a PR, so an agent or operator on a machine that cannot reach the
  # npm registry had no way to execute __tests__ at all, and "the tests pass"
  # rested on a local run nobody could reproduce.
  #
  # Verified 2026-09-01: the REST dispatch works while this trigger exists ONLY
  # on the target branch — the default-branch rule applies to the Actions UI
  # branch picker, not to the API — so this is usable before it merges.
  workflow_dispatch: {}
jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # package-lock.json is the deployment contract (the production
      # Dockerfile also uses npm ci). Keep CI on the same frozen graph.
      - run: npm ci
      - run: npx vitest run __tests__
      - run: npm run lint:cve-evidence
      - run: npm run lint:system-scope

      # Type-error gate. The baseline is zero: any regression blocks CI.
      - name: tsc-ratchet
        if: ${{ !cancelled() }}
        run: ./scripts/check_tsc_ratchet.sh
