# Aura ↔ Neptune capability parity sweep.
#
# Probes the SAME read-endpoint matrix on two backends — cyntro.io's Aura
# (Neo4j) backend and the C1 Neptune backend — and flags every endpoint
# that works on Aura but 500s / errors / comes back empty on Neptune.
# Those are the remaining C1 dialect/serve gaps to close. Data differs
# between the tenants (alon-prod vs testbed-webshop) so this compares
# CAPABILITY (does the endpoint serve real data), not values.
#
# Every request is a GET against public read endpoints; no auth, no
# mutation. Read-only against production Aura — safe.
name: ops-c1-parity-sweep

on:
  workflow_dispatch:
    inputs:
      aura_base:
        description: "Aura (cyntro.io) backend base URL"
        required: true
        default: "https://saferemediate-backend-f.onrender.com"
      aura_system:
        description: "System name that exists in the Aura tenant"
        required: true
        default: "alon-prod"
      neptune_base:
        description: "C1 Neptune backend base URL"
        required: true
        default: "https://cyntro-c1.onrender.com"
      neptune_system:
        description: "System name that exists in the Neptune tenant"
        required: true
        default: "testbed-webshop"
      pr_number:
        description: "PR in THIS repo to comment results on (empty = no comment)"
        required: false
        default: "668"

permissions:
  contents: read
  pull-requests: write

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AURA_BASE: ${{ inputs.aura_base }}
      AURA_SYS: ${{ inputs.aura_system }}
      NEP_BASE: ${{ inputs.neptune_base }}
      NEP_SYS: ${{ inputs.neptune_system }}
    steps:
      - name: Probe both backends
        run: |
          set -uo pipefail
          gaps=0; parity=0; other=0
          : > summary.md
          echo "## C1 parity sweep — Aura vs Neptune" >> summary.md
          echo "" >> summary.md
          echo "Aura: \`${AURA_BASE}\` (sys \`${AURA_SYS}\`) · Neptune: \`${NEP_BASE}\` (sys \`${NEP_SYS}\`)" >> summary.md
          echo "" >> summary.md
          echo "| endpoint | aura | neptune | verdict |" >> summary.md
          echo "|---|---|---|---|" >> summary.md

          # Wake both cold Render workers first (ignore result).
          curl -sS --max-time 90 -o /dev/null "${AURA_BASE}/health" || true
          curl -sS --max-time 90 -o /dev/null "${NEP_BASE}/health" || true

          # Fetch one URL: sets HTTP + FILE. Retries once on a 5xx/000 to
          # ride out a cold-worker hang (the real symptom, not the signal).
          fetch() {
            local base="$1" path="$2"
            FILE="$(mktemp)"
            HTTP="$(curl -sS --max-time 90 -o "$FILE" -w '%{http_code}' "${base}${path}" || echo 000)"
            case "$HTTP" in
              000|5*)
                sleep 2
                HTTP="$(curl -sS --max-time 90 -o "$FILE" -w '%{http_code}' "${base}${path}" || echo 000)" ;;
            esac
            BYTES="$(wc -c < "$FILE" | tr -d ' ')"
          }

          # A GAP is a HARD FAILURE on Neptune where Aura is fine — a crash,
          # a dialect error, or a serve-state failure. NOT a data-richness
          # difference: the two tenants differ (rich alon-prod vs minimal
          # testbed-webshop), so "Aura has rows, Neptune is empty" is
          # EXPECTED and must not be called a gap — that would push us to
          # fabricate data to make a small tenant look like a big one.
          #
          # errored = the endpoint failed to serve: non-200, or a body
          # carrying a hard backend-error signature (dialect crash, stack
          # trace, unfilled serve state). Note: no bare "error" — payloads
          # legitimately contain fields like "error_paths":[] / "error":null.
          errored() {
            local file="$1" http="$2"
            [ "$http" = "200" ] || return 0
            grep -qiE 'Type mismatch|MalformedQueryException|not supported in this release|Traceback|bmap not initialized|Internal Server Error|"detail":"[^"]*(failed|error)|NOT_READY|"serve_state":"NOT_READY"' "$file" && return 0
            return 1
          }
          # thin = well-formed but empty. Informational only — usually just
          # the smaller tenant having fewer resources, never a gap by itself.
          thin() {
            local file="$1" bytes="$2"
            [ "${bytes:-0}" -lt 25 ] && return 0
            local trimmed
            trimmed="$(tr -d ' \n\r\t' < "$file")"
            case "$trimmed" in ""|"[]"|"{}"|"null") return 0;; esac
            # A payload that is all-empty collections (crown_jewels:[],paths:[])
            # is thin too, but we can't parse JSON portably here; leave that
            # nuance to the eye. Bytes + trivial-shape covers the clear cases.
            return 1
          }

          check() {
            # check <name> <aura_path> <neptune_path>
            local name="$1" apath="$2" npath="$3"
            fetch "$AURA_BASE" "$apath"; local ah="$HTTP" af="$FILE" ab="$BYTES"
            fetch "$NEP_BASE" "$npath"; local nh="$HTTP" nf="$FILE" nb="$BYTES"
            local aerr=0 nerr=0 athin=0 nthin=0
            errored "$af" "$ah" && aerr=1
            errored "$nf" "$nh" && nerr=1
            thin "$af" "$ab" && athin=1
            thin "$nf" "$nb" && nthin=1
            local averd nverd
            if [ "$aerr" = 1 ]; then averd="${ah}✗"; elif [ "$athin" = 1 ]; then averd="${ah}∅"; else averd="${ah}✓"; fi
            if [ "$nerr" = 1 ]; then nverd="${nh}✗"; elif [ "$nthin" = 1 ]; then nverd="${nh}∅"; else nverd="${nh}✓"; fi
            local verdict detail
            if [ "$aerr" = 0 ] && [ "$nerr" = 1 ]; then
              # Aura serves, Neptune hard-fails → the real, actionable gap.
              verdict="C1 GAP"; gaps=$((gaps+1))
              detail="$(head -c 160 "$nf" | tr '\n' ' ' | tr -d '|')"
              echo "GAP   ${name}  aura=${ah} neptune=${nh}  :: ${detail}"
            elif [ "$aerr" = 1 ]; then
              verdict="n/a (aura)"; other=$((other+1))
            elif [ "$athin" = 0 ] && [ "$nthin" = 1 ]; then
              # Aura populated, Neptune well-formed but empty → tenant-data
              # difference, not a gap. Flagged for the eye, never failed.
              verdict="thin"; other=$((other+1))
              echo "THIN  ${name}  neptune empty vs aura ${ab}b — tenant-data difference (not a gap)"
            else
              verdict="parity"; parity=$((parity+1))
            fi
            echo "| ${name} | ${averd} | ${nverd} | ${verdict} |" >> summary.md
          }

          A="$AURA_SYS"; N="$NEP_SYS"
          check "health"              "/health"                                   "/health"
          check "systems"             "/api/systems"                              "/api/systems"
          check "iap-all"             "/api/identity-attack-paths/all"            "/api/identity-attack-paths/all"
          check "iap-system"          "/api/identity-attack-paths/${A}"           "/api/identity-attack-paths/${N}"
          check "iap-jewels"          "/api/identity-attack-paths/${A}/jewels"    "/api/identity-attack-paths/${N}/jewels"
          check "shared-roles"        "/api/iam/shared-roles"                     "/api/iam/shared-roles"
          check "decision-coverage"   "/api/decision-coverage/system/${A}"        "/api/decision-coverage/system/${N}"
          check "blast-radius"        "/api/business-system/${A}/blast-radius"    "/api/business-system/${N}/blast-radius"
          check "topology-risk"       "/api/topology-risk/${A}"                   "/api/topology-risk/${N}"
          check "orphan-sg"           "/api/security-groups/orphan-detection"     "/api/security-groups/orphan-detection"
          check "orphan-s3"           "/api/s3-buckets/orphan-detection"          "/api/s3-buckets/orphan-detection"
          check "orphan-iam-role"     "/api/iam-roles/orphan-detection"           "/api/iam-roles/orphan-detection"
          check "orphan-iam-policy"   "/api/iam-policies/orphan-detection"        "/api/iam-policies/orphan-detection"
          check "dep-map"             "/api/dependency-map/full"                  "/api/dependency-map/full"
          check "identities"          "/api/identities/overview"                  "/api/identities/overview"
          check "business-systems"    "/api/business-systems"                     "/api/business-systems"

          echo "" >> summary.md
          echo "**${parity} parity · ${gaps} C1 gap · ${other} thin/na** — ✓ serves · ∅ empty · ✗ errored. A **C1 GAP** = Aura serves but Neptune hard-fails (dialect crash / serve-state failure). \`thin\` = Neptune well-formed but empty vs a populated Aura — a tenant-data difference, not a gap." >> summary.md
          echo
          echo "== ${parity} parity, ${gaps} C1 gap, ${other} n/a =="
          echo "GAPS=${gaps}" >> "$GITHUB_ENV"

      - name: Comment results on PR
        if: inputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          body="$(cat summary.md)

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
          for i in 1 2 3 4; do
            if gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="$body"; then
              exit 0
            fi
            echo "comment attempt ${i} failed; retrying in $((i*5))s"
            sleep $((i*5))
          done
          echo "::warning::results comment could not be posted after 4 attempts"

      - name: Verdict
        run: |
          set -euo pipefail
          [ "${GAPS}" = "0" ] || { echo "::warning::${GAPS} C1 capability gaps vs Aura"; }
